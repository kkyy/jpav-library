[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-av-library"
version = "0.7.0"
description = "Private desktop metadata catalog and local video library"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3", "SQLAlchemy>=2.0.36,<2.1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "BLE"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
package = ["pyinstaller>=6,<7"]

[project.gui-scripts]
jpav-library = "av_library.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
